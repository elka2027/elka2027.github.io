<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#d9dfe8;--free:#cfe9c8;--free-line:#7fb37a;--accent:#2f5fd0}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .page{max-width:1500px;margin:0 auto;padding:14px 14px 30px}
  header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
  h1{font-size:21px;margin:0}
  .event{color:var(--muted);font-size:14px;margin-top:3px}
  .upd{font-size:12px;color:var(--muted);text-align:right}
  .upd .bad{color:#b42318}
  .banner{background:#fff6dd;border:1px solid #efd88a;color:#6b5200;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:13px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:13px;font-weight:400;color:var(--muted)}
  .bar{height:5px;background:#e8ecf3;border-radius:3px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:12px;align-items:start}
  @media(max-width:900px){.main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .tools{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tools .sp{flex:1}
  button{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .hallwrap{overflow:auto;max-height:80vh;padding:6px}
  svg#hall{display:block;width:100%;min-width:0;height:auto;background:#fff}
  .seat{fill:var(--free);stroke:var(--free-line);stroke-width:1}
  .seat{cursor:pointer}
  .seat.taken{stroke:rgba(0,0,0,.45)}
  .selinfo{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafbfc}
  .selinfo .t{font-size:12px;color:var(--muted)}
  .selinfo .who{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:16px;font-weight:650;overflow-wrap:anywhere}
  .selinfo .who.free{color:#2e7d32}
  .selinfo .note{margin-top:4px;font-size:14px;overflow-wrap:anywhere}
  .selinfo .hintx{color:var(--muted);font-size:13px}
  .selinfo button{margin-top:8px;font-size:12px;padding:3px 8px}
  .seat.dim{opacity:.18}
  .num{font:13px system-ui,Arial,sans-serif;fill:#1d2433;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .lbl{font-family:system-ui,Arial,sans-serif;fill:#1d2433}
  .legend{padding:10px}
  .legend h2{font-size:14px;margin:0}
  .lhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .legend .body{display:block}
  .main.collapsed{grid-template-columns:minmax(0,1fr) 46px}
  .main.collapsed .legend{padding:8px 4px;text-align:center}
  .main.collapsed .legend .body{display:none}
  .main.collapsed .lhead{flex-direction:column;margin:0}
  .main.collapsed .legend h2{writing-mode:vertical-rl;margin:10px 0 0}
  .main.collapsed #btnLegend{padding:4px 6px}
  @media(max-width:900px){.main.collapsed{grid-template-columns:1fr}.main.collapsed .legend h2{writing-mode:horizontal-tb;margin:0}.main.collapsed .lhead{flex-direction:row}}
  .legend ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
  .legend li{display:flex;align-items:center;gap:8px;padding:5px 7px;border:2px solid transparent;border-radius:8px;cursor:pointer;background:#fafbfc}
  .legend li.sel{border-color:var(--accent);background:#eef3ff}
  .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.35);flex:none}
  .legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .legend .ct{font-variant-numeric:tabular-nums;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px}
  .empty{color:var(--muted);font-size:13px}
  @media print{
    @page{size:A3 landscape;margin:8mm}
    body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}

  btnL.addEventListener("click", function(){ setCollapsed(!mainEl.classList.contains("collapsed"), true); });

  // масштаб и печать
  Array.prototype.forEach.call(document.querySelectorAll(".tools button[data-z]"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll(".tools button[data-z]"), function(x){ x.classList.remove("on"); });
      b.classList.add("on"); svg.style.width = (parseFloat(b.dataset.z) * 100) + "%";
    });
  });
  document.getElementById("btnPrint").addEventListener("click", function(){ try{ window.print(); }catch(e){} });
})();
</script>
</body>
